[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kozlov-lab"
version = "0.2.0"
description = "Object-centric 3D reconstruction and executable research on V. N. Kozlov's visual theory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
app = ["streamlit>=1.36", "plotly>=5.20", "matplotlib>=3.8"]
io = ["Pillow==12.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "gate: acceptance-gate tests that block progression to the next phase",
    "slow: experiments with a high repetition count",
]
filterwarnings = ["error::RuntimeWarning"]
